name: Build Desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality Gate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wandao_electron/package-lock.json

      - name: Install locked Node test dependencies
        working-directory: wandao_electron
        run: npm ci --ignore-scripts

      - name: Run Python and frontend quality checks
        env:
          WANDAO_SKIP_RUST_CHECKS: "1"
        run: python scripts/quality_check.py

  rust-quality:
    name: Rust Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wandao_electron/src-tauri

      - name: Check formatting
        working-directory: wandao_electron/src-tauri
        run: cargo fmt --all -- --check

      - name: Check all Rust targets
        working-directory: wandao_electron/src-tauri
        run: cargo check --all-targets --locked

      - name: Run Rust tests
        working-directory: wandao_electron/src-tauri
        run: cargo test --all-targets --locked

      - name: Run Clippy
        working-directory: wandao_electron/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  quality-gate:
    name: Quality Gate
    needs: [quality, rust-quality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        shell: bash
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.rust-quality.result }}" != "success" ]; then
            echo "Python/Node matrix: ${{ needs.quality.result }}" >&2
            echo "Rust gate: ${{ needs.rust-quality.result }}" >&2
            exit 1
          fi
          echo "All quality jobs passed."

  package-smoke:
    name: PR Windows Tauri Package Smoke
    needs: quality-gate
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wandao_electron/package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wandao_electron/src-tauri

      - name: Install Tauri CLI
        working-directory: wandao_electron
        run: npm ci

      - name: Prepare Python and build NSIS installer
        working-directory: wandao_electron
        run: npm run build:win:unsigned

      - name: Verify legacy Electron migration and install candidate
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne "true" -or $env:RUNNER_ENVIRONMENT -ne "github-hosted") {
            throw "The legacy upgrade fixture is restricted to an ephemeral GitHub-hosted runner"
          }
          $installer = Get-ChildItem wandao_electron/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer was not generated" }

          $legacyKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\1b0cbfbe-638f-5e34-9149-e794da0edaeb"
          $legacyRoot = Join-Path $env:LOCALAPPDATA "Programs\wandao"
          $legacyMain = Join-Path $legacyRoot "Wandao.exe"
          $legacyUninstaller = Join-Path $legacyRoot "Uninstall Wandao.exe"
          $legacyUserData = Join-Path $env:APPDATA "wandao"
          $customLegacyRoot = Join-Path $env:RUNNER_TEMP "wandao-custom-legacy"
          $customBlockedRoot = Join-Path $env:RUNNER_TEMP "wandao-tauri-custom-path-upgrade"
          $blockedRoot = Join-Path $env:RUNNER_TEMP "wandao-tauri-untrusted-upgrade"
          $runningBlockedRoot = Join-Path $env:RUNNER_TEMP "wandao-tauri-running-upgrade"
          $installRoot = Join-Path $env:RUNNER_TEMP "wandao-tauri-legacy-upgrade"
          $fixtureMarker = Join-Path $env:RUNNER_TEMP "wandao-legacy-fixture-invoked.txt"
          $maliciousMarker = Join-Path $env:RUNNER_TEMP "wandao-malicious-command-executed"
          foreach ($unusedPath in @($legacyRoot, $legacyUserData, $customLegacyRoot, $customBlockedRoot, $blockedRoot, $runningBlockedRoot, $installRoot, $fixtureMarker, $maliciousMarker)) {
            if (Test-Path -LiteralPath $unusedPath) { throw "Fixture path is not clean: $unusedPath" }
          }
          if (Test-Path -LiteralPath $legacyKey) { throw "Legacy uninstall key already exists" }
          if (Test-Path -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Wandao") {
            throw "Tauri uninstall key already exists"
          }

          New-Item -ItemType Directory -Path $legacyRoot | Out-Null
          New-Item -ItemType Directory -Path $legacyUserData | Out-Null
          Set-Content -LiteralPath (Join-Path $legacyUserData "migration-sentinel.txt") -Value "preserve-me" -NoNewline
          rustc tests/fixtures/windows_legacy_uninstaller.rs -o $legacyUninstaller
          if ($LASTEXITCODE -ne 0) { throw "Could not compile the controlled legacy uninstaller fixture" }
          Copy-Item -LiteralPath $legacyUninstaller -Destination $legacyMain
          $env:WANDAO_LEGACY_FIXTURE_MARKER = $fixtureMarker

          New-Item -Path $legacyKey -Force | Out-Null
          $displayVersion = "1.3.10"
          $uninstallString = "`"$legacyUninstaller`" /currentuser"
          $quietUninstallString = "$uninstallString /S"
          New-ItemProperty -LiteralPath $legacyKey -Name DisplayName -Value "万能导 Wandao $displayVersion" -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $legacyKey -Name DisplayVersion -Value $displayVersion -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $legacyKey -Name Publisher -Value "tllovesxs" -PropertyType String -Force | Out-Null

          # Even internally consistent registry values must not authorize an
          # arbitrary executable from a user-selected legacy install path.
          $customLegacyMain = Join-Path $customLegacyRoot "Wandao.exe"
          $customLegacyUninstaller = Join-Path $customLegacyRoot "Uninstall Wandao.exe"
          New-Item -ItemType Directory -Path $customLegacyRoot | Out-Null
          Set-Content -LiteralPath $customLegacyMain -Value "controlled custom legacy main" -NoNewline
          Copy-Item -LiteralPath $legacyUninstaller -Destination $customLegacyUninstaller
          $customUninstallString = "`"$customLegacyUninstaller`" /currentuser"
          New-ItemProperty -LiteralPath $legacyKey -Name DisplayIcon -Value "$customLegacyMain,0" -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $legacyKey -Name UninstallString -Value $customUninstallString -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $legacyKey -Name QuietUninstallString -Value "$customUninstallString /S" -PropertyType String -Force | Out-Null
          $customBlocked = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$customBlockedRoot") -PassThru -Wait
          if ($customBlocked.ExitCode -eq 0) { throw "Installer accepted a custom legacy install directory" }
          if (-not (Test-Path -LiteralPath $legacyKey) -or -not (Test-Path -LiteralPath $customLegacyMain) -or -not (Test-Path -LiteralPath $customLegacyUninstaller)) {
            throw "Rejected custom-directory migration modified the legacy fixture"
          }
          if (Test-Path -LiteralPath (Join-Path $customBlockedRoot "Wandao.exe")) {
            throw "Rejected custom-directory migration wrote the candidate application"
          }
          if (Test-Path -LiteralPath $fixtureMarker) {
            throw "Rejected custom-directory migration executed the legacy fixture"
          }

          New-ItemProperty -LiteralPath $legacyKey -Name DisplayIcon -Value "$legacyMain,0" -PropertyType String -Force | Out-Null
          New-ItemProperty -LiteralPath $legacyKey -Name UninstallString -Value $uninstallString -PropertyType String -Force | Out-Null

          # Untrusted registry command text must abort before writing the new application.
          $maliciousQuietUninstall = "`"$env:ComSpec`" /d /c mkdir `"$maliciousMarker`""
          New-ItemProperty -LiteralPath $legacyKey -Name QuietUninstallString -Value $maliciousQuietUninstall -PropertyType String -Force | Out-Null
          $blocked = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$blockedRoot") -PassThru -Wait
          if ($blocked.ExitCode -eq 0) { throw "Installer accepted an untrusted legacy uninstall command" }
          if (-not (Test-Path -LiteralPath $legacyKey) -or -not (Test-Path -LiteralPath $legacyMain)) {
            throw "Rejected migration modified the legacy installation"
          }
          if (Test-Path -LiteralPath (Join-Path $blockedRoot "Wandao.exe")) {
            throw "Rejected migration wrote the candidate application"
          }
          if (Test-Path -LiteralPath $maliciousMarker) {
            throw "Rejected migration executed untrusted registry command text"
          }
          if (Test-Path -LiteralPath $fixtureMarker) {
            throw "Rejected untrusted-command migration executed the legacy fixture"
          }

          New-ItemProperty -LiteralPath $legacyKey -Name QuietUninstallString -Value $quietUninstallString -PropertyType String -Force | Out-Null

          # A silent upgrade must fail without terminating the running legacy
          # application or invoking its uninstaller.
          $legacyProcess = Start-Process -FilePath $legacyMain -ArgumentList @("--stay-running") -PassThru
          try {
            Start-Sleep -Milliseconds 500
            $legacyProcess.Refresh()
            if ($legacyProcess.HasExited) { throw "Controlled legacy process did not remain running" }
            $runningBlocked = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$runningBlockedRoot") -PassThru -Wait
            if ($runningBlocked.ExitCode -eq 0) { throw "Installer accepted a running legacy application" }
            $legacyProcess.Refresh()
            if ($legacyProcess.HasExited) { throw "Installer terminated the running legacy application" }
            if (-not (Test-Path -LiteralPath $legacyKey) -or -not (Test-Path -LiteralPath $legacyMain) -or -not (Test-Path -LiteralPath $legacyUninstaller)) {
              throw "Rejected running-process migration modified the legacy fixture"
            }
            if (Test-Path -LiteralPath (Join-Path $runningBlockedRoot "Wandao.exe")) {
              throw "Rejected running-process migration wrote the candidate application"
            }
            if (Test-Path -LiteralPath $fixtureMarker) {
              throw "Rejected running-process migration invoked the legacy uninstaller"
            }
          } finally {
            $legacyProcess.Refresh()
            if (-not $legacyProcess.HasExited) {
              Stop-Process -Id $legacyProcess.Id -Force
              Wait-Process -Id $legacyProcess.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
          }

          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installRoot") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          if (Test-Path -LiteralPath $legacyKey) { throw "Legacy uninstall key survived the migration" }
          if (Test-Path -LiteralPath $legacyMain) { throw "Legacy main executable survived the migration" }
          $sentinel = Join-Path $legacyUserData "migration-sentinel.txt"
          if ((Get-Content -Raw -LiteralPath $sentinel) -ne "preserve-me") {
            throw "Legacy user data was not preserved"
          }
          if (-not (Test-Path -LiteralPath $fixtureMarker)) {
            throw "Trusted migration did not invoke the controlled legacy uninstaller"
          }
          $fixtureInvocation = Get-Content -Raw -LiteralPath $fixtureMarker
          if (-not $fixtureInvocation.Contains($legacyUninstaller) -or -not $fixtureInvocation.Contains("/currentuser") -or -not $fixtureInvocation.Contains("/S")) {
            throw "Trusted migration invoked the legacy fixture with unexpected path or arguments"
          }
          $appExecutable = Get-ChildItem -LiteralPath $installRoot -Filter *.exe -File | Where-Object { $_.BaseName -ieq "wandao" } | Select-Object -First 1
          if (-not $appExecutable) { throw "Installed Wandao executable was not found" }
          "WANDAO_SMOKE_RESOURCES=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WANDAO_SMOKE_EXECUTABLE=$($appExecutable.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed application and Plugin v1 resources
        run: python scripts/package_smoke.py --resources "$env:WANDAO_SMOKE_RESOURCES" --executable "$env:WANDAO_SMOKE_EXECUTABLE"

  build:
    name: Build ${{ matrix.name }} (${{ github.event_name == 'workflow_dispatch' && 'unsigned smoke' || 'signed release' }})
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'desktop-release' || 'unsigned-smoke' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            unsigned_command: npm run build:win:unsigned
            artifact: wandao-Windows-x64
            rust_target: x86_64-pc-windows-msvc
          - name: macOS Apple-Silicon
            os: macos-15
            unsigned_command: npm run build:mac:arm64:unsigned
            artifact: wandao-macOS-arm64
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Windows release signing credentials
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $required = @{
            WINDOWS_CERTIFICATE = $env:WINDOWS_CERTIFICATE
            WINDOWS_CERTIFICATE_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
            WINDOWS_CERTIFICATE_THUMBPRINT = $env:WINDOWS_CERTIFICATE_THUMBPRINT
            WINDOWS_TIMESTAMP_URL = $env:WINDOWS_TIMESTAMP_URL
          }
          $missing = @(
            $required.GetEnumerator() |
              Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
              ForEach-Object Key
          )
          if ($missing.Count -gt 0) {
            throw "Missing desktop-release secrets: $($missing -join ', ')"
          }
          $thumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($thumbprint.Length -ne 40) {
            throw "WINDOWS_CERTIFICATE_THUMBPRINT must be a 40-character SHA-1 certificate thumbprint"
          }
          $timestampUri = $null
          if (-not [Uri]::TryCreate($env:WINDOWS_TIMESTAMP_URL, [UriKind]::Absolute, [ref]$timestampUri) -or
              $timestampUri.Scheme -notin @('http', 'https')) {
            throw "WINDOWS_TIMESTAMP_URL must be an absolute HTTP(S) timestamp URL"
          }

      - name: Require Apple release signing and notarization credentials
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing desktop-release secrets: ${missing[*]}" >&2
            exit 1
          fi
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "APPLE_SIGNING_IDENTITY must be a Developer ID Application identity" >&2
            exit 1
          fi
          if [[ "$APPLE_SIGNING_IDENTITY" != *"($APPLE_TEAM_ID)"* ]]; then
            echo "APPLE_SIGNING_IDENTITY does not match APPLE_TEAM_ID" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wandao_electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wandao_electron/src-tauri

      - name: Install Tauri CLI
        working-directory: wandao_electron
        run: npm ci

      - name: Verify desktop version contract
        shell: bash
        run: |
          package_version="$(node -p "require('./wandao_electron/package.json').version")"
          tauri_version="$(node -p "require('./wandao_electron/src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk '$0 == "[package]" { package = 1; next } /^\[/ { package = 0 } package && /^version = / { gsub(/[\"[:space:]]/, "", $3); print $3; exit }' wandao_electron/src-tauri/Cargo.toml)"
          if [ "$package_version" != "$tauri_version" ] || [ "$package_version" != "$cargo_version" ]; then
            echo "Desktop versions differ: package=$package_version tauri=$tauri_version cargo=$cargo_version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v${package_version}" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match desktop version v${package_version}" >&2
            exit 1
          fi

      - name: Verify Apple Silicon build host
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Import Windows release certificate
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "wandao-release-certificate.pfx"
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null

            $thumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
            $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction Stop
            if (-not $certificate.HasPrivateKey) {
              throw "The configured Windows code-signing certificate has no private key"
            }

            $releaseConfig = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $thumbprint
                  digestAlgorithm = "sha256"
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            }
            $configPath = Join-Path $env:RUNNER_TEMP "wandao-tauri-windows-release.json"
            $releaseConfig | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $configPath -Encoding utf8
            "WANDAO_TAURI_WINDOWS_RELEASE_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              [IO.File]::Delete($certificatePath)
            }
          }

      - name: Import Apple Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/wandao-release-certificate.p12"
          keychain_path="$RUNNER_TEMP/wandao-release.keychain-db"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path" >/dev/null
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$APPLE_SIGNING_IDENTITY"

      - name: Build unsigned desktop smoke package
        if: github.event_name == 'workflow_dispatch'
        working-directory: wandao_electron
        run: ${{ matrix.unsigned_command }}

      - name: Build signed Windows release package
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        working-directory: wandao_electron
        shell: pwsh
        run: npm run build:win:release -- --config "$env:WANDAO_TAURI_WINDOWS_RELEASE_CONFIG"

      - name: Build signed and notarized macOS release package
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        working-directory: wandao_electron
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac:arm64:release

      - name: Verify Windows Authenticode signatures
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $expectedThumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          $installer = Get-ChildItem wandao_electron/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $application = Get-Item -LiteralPath wandao_electron/src-tauri/target/release/wandao.exe -ErrorAction Stop
          if (-not $installer) { throw "Tauri NSIS installer was not generated" }
          foreach ($candidate in @($application, $installer)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $candidate.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature for $($candidate.Name): $($signature.Status)"
            }
            $actualThumbprint = $signature.SignerCertificate.Thumbprint.ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) {
              throw "Unexpected Authenticode signer for $($candidate.Name)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Authenticode signature for $($candidate.Name) has no trusted timestamp"
            }
          }

      - name: Verify macOS Developer ID signature and notarization
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app_path="$(find wandao_electron/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          grep -F "Authority=$APPLE_SIGNING_IDENTITY" <<<"$codesign_details"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<<"$codesign_details"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem wandao_electron/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer was not generated" }
          $installRoot = Join-Path $env:RUNNER_TEMP "wandao-tauri-release-smoke"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/SKIPLEGACYUNINSTALL", "/D=$installRoot") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          $appExecutable = Get-ChildItem -LiteralPath $installRoot -Filter *.exe -File | Where-Object { $_.BaseName -ieq "wandao" } | Select-Object -First 1
          if (-not $appExecutable) { throw "Installed Wandao executable was not found" }
          python scripts/package_smoke.py --resources "$installRoot" --executable "$($appExecutable.FullName)"

      - name: Smoke test macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find wandao_electron/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          bundle_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          minimum_system="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_path/Contents/Info.plist")"
          test "$minimum_system" = "11.0"
          file "$app_path/Contents/MacOS/$bundle_executable" | grep -q 'arm64'
          for resource in assets plugins providers python python-runtime; do
            test -d "$app_path/Contents/Resources/$resource"
          done
          python scripts/package_smoke.py --resources "$app_path" --executable "$app_path"

      - name: Prepare Windows release file
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $source = Get-ChildItem wandao_electron/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $source) { throw "Tauri NSIS installer was not generated" }
          $version = (Get-Content wandao_electron/package.json | ConvertFrom-Json).version
          $suffix = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "UNSIGNED-SMOKE" } else { "setup" }
          Copy-Item $source.FullName "release-output/Wandao-$version-win-x64-$suffix.exe"

      - name: Prepare macOS release file
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-output
          app_path="$(find wandao_electron/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          version="$(node -p "require('./wandao_electron/package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            output="release-output/Wandao-${version}-macOS-arm64-UNSIGNED-SMOKE.zip"
          else
            output="release-output/Wandao-${version}-macOS-arm64.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$output"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('{0}-UNSIGNED-SMOKE', matrix.artifact) || matrix.artifact }}
          path: release-output/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: find release-artifacts -type f

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/wandao.spdx.json

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-artifacts/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Wandao ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS
            release-artifacts/wandao.spdx.json
